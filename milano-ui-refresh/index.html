<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault - Milano Refresh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --milano-dark: #12335b;
            --milano-orange: #f8972b;
            --milano-bg: #f5f5f5;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: var(--milano-bg);
            color: #1d1d1d;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* AI Sparkle Animation */
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .ai-sparkle {
            animation: sparkle 2s infinite ease-in-out;
            color: #8b5cf6; /* Purple for AI */
        }
    </style>
</head>
<body class="flex flex-row relative">
    
    <!-- Far-Left Tab Bar -->
    <div class="w-[56px] bg-[var(--milano-dark)] border-r border-white/10 flex flex-col items-center py-4 shrink-0 relative z-20">
        <div class="w-8 h-8 bg-white/10 rounded mb-8 flex items-center justify-center cursor-pointer hover:bg-white/20">
            <i class="fas fa-cube text-white"></i>
        </div>
        <div class="flex flex-col gap-6 w-full items-center">
            <div class="relative w-full flex justify-center cursor-pointer text-white">
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-[var(--milano-orange)]"></div>
                <i class="fas fa-home text-lg"></i>
            </div>
            <div class="w-full flex justify-center cursor-pointer text-white/50 hover:text-white">
                <i class="fas fa-search text-lg"></i>
            </div>
            <div class="w-full flex justify-center cursor-pointer text-white/50 hover:text-white">
                <i class="fas fa-bell text-lg"></i>
            </div>
        </div>
        <div class="mt-auto flex flex-col gap-6 w-full items-center mb-4">
            <div class="w-full flex justify-center cursor-pointer text-white/50 hover:text-white">
                <i class="fas fa-cog text-lg"></i>
            </div>
            <div class="w-8 h-8 bg-gray-400 rounded-full border-2 border-transparent overflow-hidden cursor-pointer hover:border-white">
                <img src="https://ui-avatars.com/api/?name=David+Mills&background=random&color=fff" alt="User Avatar">
            </div>
        </div>
    </div>

    <!-- Inner Left Navigation -->
    <div class="w-[304px] bg-[var(--milano-dark)] flex flex-col shrink-0 relative z-10 shadow-lg">
        <div class="h-[74px] px-6 flex items-center border-b border-white/10 shrink-0">
            <span class="text-white font-bold text-lg tracking-wide"><span class="text-[var(--milano-orange)]">Veeva</span> Vault</span>
        </div>
        
        <div class="px-6 py-4 flex flex-col gap-3 shrink-0">
            <div class="flex justify-between items-center text-white/50 text-xs font-semibold uppercase tracking-wider">
                Views <i class="fas fa-chevron-down"></i>
            </div>
            <!-- Navigation Filter -->
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-white/30 text-xs"></i>
                <input type="text" id="navFilter" onkeyup="filterNav()" placeholder="Filter views..." class="w-full bg-white/10 border border-white/10 rounded text-white text-sm pl-8 pr-3 py-1.5 focus:outline-none focus:border-[var(--milano-orange)] placeholder-white/30">
            </div>
        </div>
        
        <ul id="navList" class="flex-1 overflow-y-auto custom-scrollbar pb-6 space-y-1">
            <!-- Populated by JS -->
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 bg-[var(--milano-bg)]">
        <!-- Page Header -->
        <div class="h-[84px] bg-white border-b border-gray-200 flex justify-between items-center px-8 shrink-0">
            <h1 id="pageTitle" class="text-2xl font-semibold text-gray-800">Library</h1>
            
            <div class="flex items-center gap-4">
                <!-- AI Augmented Search -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-magic ai-sparkle"></i>
                    </div>
                    <input type="text" placeholder="Ask Vault AI to find..." class="pl-10 pr-4 py-2 border border-purple-200 bg-purple-50/30 rounded-full text-sm focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 w-80 transition-all shadow-sm">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <span class="text-xs text-purple-400 font-medium border border-purple-200 rounded px-1.5 bg-white">⌘K</span>
                    </div>
                </div>
                
                <button class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 rounded-md shadow-sm text-sm font-medium px-4 py-2">
                    Filters <i class="fas fa-filter ml-1 text-gray-400"></i>
                </button>
                <button class="bg-[#1453b8] text-white hover:bg-[#0f4092] rounded-md shadow-sm text-sm font-medium px-4 py-2 flex items-center gap-2">
                    <i class="fas fa-plus"></i> Create
                </button>
            </div>
        </div>

        <!-- DataGrid Container -->
        <div class="flex-1 p-8 overflow-hidden flex flex-col">
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <div id="recordCount" class="text-sm text-gray-500 font-medium">0 records</div>
                    <div class="flex gap-2">
                        <button class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 flex items-center justify-center text-gray-400 disabled:opacity-50"><i class="fas fa-chevron-left"></i></button>
                        <button class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-50 flex items-center justify-center text-gray-600"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead id="gridHead" class="sticky top-0 bg-gray-50 z-10 shadow-sm">
                            <!-- Populated by JS -->
                        </thead>
                        <tbody id="gridBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Chat Widget -->
    <div id="aiChatWidget" class="absolute bottom-6 right-8 w-80 bg-white rounded-xl shadow-2xl border border-gray-200 flex flex-col hidden transition-all duration-300 z-50 overflow-hidden" style="height: 450px;">
        <!-- Chat Header -->
        <div class="bg-purple-600 text-white px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-robot text-lg"></i>
                <span class="font-semibold">Vault Assistant</span>
            </div>
            <button onclick="toggleChat()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <!-- Chat Body -->
        <div class="flex-1 p-4 overflow-y-auto bg-gray-50 text-sm space-y-4">
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center shrink-0"><i class="fas fa-magic"></i></div>
                <div class="bg-white border border-gray-200 p-3 rounded-lg rounded-tl-none shadow-sm text-gray-700">
                    Hello David! I can help you query your data, summarize documents, or navigate Vault. What would you like to do?
                </div>
            </div>
        </div>
        <!-- Chat Input -->
        <div class="p-3 bg-white border-t border-gray-200">
            <div class="relative">
                <input type="text" placeholder="Message assistant..." class="w-full bg-gray-100 border-transparent focus:bg-white focus:border-purple-400 rounded-full pl-4 pr-10 py-2 text-sm outline-none transition-colors">
                <button class="absolute right-2 top-1/2 transform -translate-y-1/2 text-purple-600 hover:text-purple-800 p-1">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Chat FAB -->
    <button onclick="toggleChat()" class="absolute bottom-6 right-8 w-14 h-14 bg-purple-600 hover:bg-purple-700 text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-transform hover:scale-105 z-40">
        <i class="fas fa-sparkles"></i>
    </button>

        let activeTable = 'Library';

        function renderNav() {
            const list = document.getElementById('navList');
            const filterText = document.getElementById('navFilter').value.toLowerCase();
            list.innerHTML = '';
            
            tables.forEach(name => {
                if (name.toLowerCase().includes(filterText)) {
                    const isActive = name === activeTable;
                    const icon = name === 'Library' ? 'fa-folder-open' : 'fa-table';
                    
                    const li = document.createElement('li');
                    li.className = isActive 
                        ? 'px-4 py-2 text-[14px] flex items-center gap-3 text-white font-semibold cursor-pointer bg-[#ffffff1a] rounded-md mx-2'
                        : 'px-4 py-2 text-[14px] flex items-center gap-3 text-gray-400 hover:text-white hover:bg-[#ffffff0a] rounded-md mx-2 cursor-pointer';
                    
                    li.onclick = () => { activeTable = name; renderNav(); renderTable(); };
                    li.innerHTML = `<i class="fas ${icon} ${isActive ? 'text-gray-300' : ''} w-4"></i> ${name}`;
                    list.appendChild(li);
                }
            });
        }

        function renderTable() {
            document.getElementById('pageTitle').innerText = activeTable;
            const data = dbData[activeTable];
            
            const thead = document.getElementById('gridHead');
            const tbody = document.getElementById('gridBody');
            const count = document.getElementById('recordCount');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';
            
            if (!data || !data.columns || data.columns.length === 0) {
                count.innerText = "0 records";
                tbody.innerHTML = '<tr><td class="p-8 text-center text-gray-500 italic">No data available for this view.</td></tr>';
                return;
            }
            
            count.innerText = `1-${data.rows.length} of ${data.rows.length} records`;
            
            // Render Headers
            const trHead = document.createElement('tr');
            data.columns.forEach(col => {
                const th = document.createElement('th');
                th.className = 'font-semibold text-[12px] text-gray-500 uppercase tracking-wider py-3 px-4 border-b border-gray-200';
                th.innerText = col;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            
            // Render Rows
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 border-b border-gray-200 cursor-pointer';
                row.forEach((cell, idx) => {
                    const td = document.createElement('td');
                    td.className = 'py-3 px-4 text-[13px] text-gray-600 truncate max-w-[200px]';
                    if (idx === 0) td.classList.add('text-[#1453b8]', 'font-medium', 'hover:underline');
                    td.innerText = cell !== null ? cell : '';
                    td.title = cell !== null ? cell : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function filterNav() {
            renderNav();
        }

        function toggleChat() {
            const chat = document.getElementById('aiChatWidget');
            chat.classList.toggle('hidden');
        }

        // Initialize
        renderNav();
        renderTable();
