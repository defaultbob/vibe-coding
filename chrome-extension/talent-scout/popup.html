<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f2ef;
        }
        h2 {
            margin-top: 0;
            color: #0a66c2;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .hidden { display: none; }
        
        /* Result Styles */
        #results {
            text-align: center;
            margin-top: 10px;
        }
        #grade {
            font-size: 64px;
            margin: 10px 0;
            font-weight: 800;
        }
        .grade-A { color: #43a047; }
        .grade-B { color: #fdd835; text-shadow: 1px 1px 0 #999; }
        .grade-C { color: #fb8c00; }
        .grade-D { color: #e53935; }
        .grade-F { color: #b71c1c; }
        
        .score-row {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        .details-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        button {
            width: 100%;
            padding: 8px;
            background-color: #0a66c2;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #004182; }

        #error-msg {
            color: #d32f2f;
            font-size: 13px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h2>TalentScout Grader</h2>
    
    <div id="loading">Scanning profile...</div>

    <div id="error-msg" class="hidden"></div>

    <div id="results" class="hidden">
        <div id="grade"></div>
        <div class="score-row">Score: <span id="score"></span>/100</div>
        
        <div class="details-box">
            <div class="detail-item">
                <span>Avg Tenure:</span>
                <strong id="avg-tenure"></strong>
            </div>
            <div class="detail-item">
                <span>Jobs Analyzed:</span>
                <strong id="job-count"></strong>
            </div>
            <div class="detail-item">
                <span>Product Co. Focus:</span>
                <strong id="product-focus"></strong>
            </div>
        </div>
    </div>
    
    <button id="scanBtn">Re-Scan Page</button>
    <script src="popup.js"></script>
</body>
</html>
