<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #ffd8a8;
    --bg-2: #ffb4c6;
    --card-bg: #ffffff;
    --ink: #3a2e4d;
    --muted: #7a6f8c;
    --accent: #ff6f91;
    --accent-2: #6fcf97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    padding: 48px 24px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 48px;
  }
  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
    text-shadow: 3px 3px 0 rgba(255,255,255,.5);
  }
  header p {
    margin: 0;
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 600;
  }
  .grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 8px 0 rgba(0,0,0,.08), 0 12px 24px rgba(0,0,0,.12);
    transition: transform .15s ease, box-shadow .15s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-6px) rotate(-0.5deg);
    box-shadow: 0 12px 0 rgba(0,0,0,.08), 0 18px 30px rgba(0,0,0,.16);
  }
  .card-thumb {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .card-body {
    padding: 18px 20px 22px;
  }
  .card-title {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1.25rem;
    margin: 0 0 6px;
  }
  .card-desc {
    margin: 0;
    font-size: .95rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-weight: 600;
    grid-column: 1 / -1;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <header>
    <h1>🎮 Games</h1>
    <p>Pick something to play</p>
  </header>

  <div class="grid">
    <a class="card" href="Crumble Cozy Town Paws Homes.html">
      <div class="card-thumb">🐾</div>
      <div class="card-body">
        <h2 class="card-title">Crumble's Cozy Town: Paws &amp; Homes</h2>
        <p class="card-desc">Build cozy homes and take care of adorable pets in this relaxing town sim.</p>
      </div>
    </a>
  </div>
</body>
</html>
