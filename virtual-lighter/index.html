<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Virtual Lighter</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lighter">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: #000;
  }

  /* soft ambient glow cast on the "room" when lit */
  #glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: radial-gradient(ellipse at 50% 85%, rgba(255,150,40,0.35) 0%, rgba(255,120,20,0.12) 30%, rgba(0,0,0,0) 65%);
  }
  #stage.lit #glow { opacity: 1; }

  #flameWrap {
    position: relative;
    width: 100%;
    height: 62vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transform-origin: 50% 100%;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  #stage.lit #flameWrap { opacity: 1; }

  .flame-layer {
    position: absolute;
    bottom: 6vh;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    filter: blur(1px);
    will-change: transform, opacity, border-radius;
  }

  #flameOuter {
    width: 34vw;
    max-width: 220px;
    height: 46vh;
    background: radial-gradient(ellipse 60% 80% at 50% 75%,
      #fff7cf 0%,
      #ffd23f 18%,
      #ff9d1f 40%,
      #ff5b1f 62%,
      #e8380c 80%,
      rgba(180, 30, 0, 0) 100%);
    filter: blur(2px);
    opacity: 0.95;
  }

  #flameInner {
    width: 14vw;
    max-width: 90px;
    height: 22vh;
    bottom: 8vh;
    background: radial-gradient(ellipse 60% 80% at 50% 80%,
      #ffffff 0%,
      #fff6c8 25%,
      #ffe066 55%,
      #ffb23f 80%,
      rgba(255, 150, 20, 0) 100%);
    filter: blur(0.5px);
  }

  #flameCore {
    width: 6vw;
    max-width: 34px;
    height: 9vh;
    bottom: 8vh;
    background: radial-gradient(ellipse 60% 80% at 50% 85%,
      #eaf6ff 0%,
      #bfe6ff 40%,
      #6fb8ff 70%,
      rgba(80, 150, 255, 0) 100%);
    opacity: 0.85;
  }

  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8vh;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.02em;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  #stage.lit #hint { opacity: 0; }

  #fsBtn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 5;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 8px 14px;
    font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity 0.4s ease;
  }
  #stage.lit #fsBtn { opacity: 0.25; }
</style>
</head>
<body>
  <div id="stage">
    <div id="glow"></div>
    <button id="fsBtn" type="button">Fullscreen</button>
    <div id="flameWrap">
      <div class="flame-layer" id="flameOuter"></div>
      <div class="flame-layer" id="flameInner"></div>
      <div class="flame-layer" id="flameCore"></div>
    </div>
    <div id="hint">Tap to light &middot; swipe up/down to adjust flame</div>
  </div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const flameWrap = document.getElementById('flameWrap');
  const fsBtn = document.getElementById('fsBtn');

  let lit = false;
  let flameScale = 1;
  const MIN_SCALE = 0.55;
  const MAX_SCALE = 1.6;

  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { /* ignore: not all browsers/contexts support it */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lit) requestWakeLock();
  });

  function setLit(on) {
    lit = on;
    stage.classList.toggle('lit', lit);
    if (lit) requestWakeLock();
  }

  function applyScale() {
    flameWrap.style.transform = 'scale(' + flameScale + ')';
  }

  // Flicker loop: subtly randomizes each flame layer's size/skew every frame
  // to read as a real flame instead of a static shape.
  let t = 0;
  function flicker() {
    t += 1;
    if (lit) {
      const layers = [
        { el: document.getElementById('flameOuter'), amp: 0.05, speed: 0.09 },
        { el: document.getElementById('flameInner'), amp: 0.08, speed: 0.14 },
        { el: document.getElementById('flameCore'), amp: 0.10, speed: 0.2 }
      ];
      layers.forEach((l, i) => {
        const n = Math.sin(t * l.speed + i * 10) * l.amp
                + Math.sin(t * l.speed * 2.3 + i * 3) * l.amp * 0.5
                + (Math.random() - 0.5) * l.amp * 0.6;
        const skew = Math.sin(t * 0.05 + i) * 2.5;
        l.el.style.transform = 'translateX(' + (skew) + 'px) scale(' + (1 + n) + ')';
      });
    }
    requestAnimationFrame(flicker);
  }
  requestAnimationFrame(flicker);

  function toggleLit() {
    setLit(!lit);
  }

  // Tap to toggle. Swipe (vertical drag) to resize the flame instead of toggling.
  let startY = null;
  let startScale = flameScale;
  let dragged = false;

  stage.addEventListener('pointerdown', (e) => {
    if (e.target === fsBtn) return;
    startY = e.clientY;
    startScale = flameScale;
    dragged = false;
  });

  stage.addEventListener('pointermove', (e) => {
    if (startY === null) return;
    const dy = startY - e.clientY;
    if (Math.abs(dy) > 8) dragged = true;
    if (dragged) {
      flameScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, startScale + dy / 300));
      applyScale();
    }
  });

  function endDrag(e) {
    if (startY === null) return;
    if (!dragged && e.target !== fsBtn) toggleLit();
    startY = null;
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  fsBtn.addEventListener('click', () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  });
})();
</script>
</body>
</html>
